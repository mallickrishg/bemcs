name: bemcs
channels:
  - conda-forge
dependencies:
  - python=3.14
  - numpy>=2.5
  - ipykernel
  - scipy
  - matplotlib
  - jupyterlab
  - pytest
  - mpmath  # tests: 50-digit reference evaluation of the kernels
  - addict
  - tqdm
  - h5py
  - colorcet
  - cmcrameri
  - rich
  - pandas
  - quadpy  # 0.16.10: the last open-source release
  - shapely
  - geopandas
  - numba>=0.68
  - pip
  - pip:
      - pygmsh
      - -e .  # bemcs itself, editable
