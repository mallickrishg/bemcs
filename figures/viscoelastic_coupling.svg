<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="Helvetica, Arial, sans-serif">
<title>Coupling between a fault law and the viscoelastic boundary state</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
.t{font-size:12px;fill:#444441}.h{font-size:14px;font-weight:500;fill:#2C2C2A}.a{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<rect width="680" height="340" fill="#ffffff"/>
<rect x="26" y="106" width="486" height="120" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="t" x="38" y="124">integrated together (RK45 or BDF)</text>
<rect x="40" y="136" width="150" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="h" x="115" y="158" text-anchor="middle" dominant-baseline="central">Fault law</text>
<text class="t" x="115" y="180" text-anchor="middle" dominant-baseline="central">rate-and-state, theta</text>
<rect x="290" y="136" width="200" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="h" x="390" y="158" text-anchor="middle" dominant-baseline="central">Boundary state y</text>
<text class="t" x="390" y="180" text-anchor="middle" dominant-baseline="central">dy/dt = A y + G v + g_r</text>
<rect x="290" y="26" width="200" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="h" x="390" y="50" text-anchor="middle" dominant-baseline="central">Loading</text>
<text class="t" x="500" y="44">prescribed creep rate,</text><text class="t" x="500" y="62">far-field stress rate</text>
<rect x="290" y="262" width="200" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="h" x="390" y="286" text-anchor="middle" dominant-baseline="central">Observables</text>
<text class="t" x="500" y="280">surface velocity,</text><text class="t" x="500" y="298">tractions, stresses</text>
<line class="a" x1="190" y1="154" x2="288" y2="154" marker-end="url(#arrow)"/>
<text class="t" x="240" y="146" text-anchor="middle">slip rate v</text>
<line class="a" x1="288" y1="184" x2="192" y2="184" marker-end="url(#arrow)"/>
<text class="t" x="240" y="202" text-anchor="middle">traction</text>
<line class="a" x1="390" y1="74" x2="390" y2="134" marker-end="url(#arrow)"/>
<line class="a" x1="390" y1="200" x2="390" y2="260" marker-end="url(#arrow)"/>
<text class="t" x="528" y="148">A, G: dense,</text><text class="t" x="528" y="166">boundary only</text><text class="t" x="528" y="184">G has elastic</text><text class="t" x="528" y="202">fault stiffness</text>
</svg>
