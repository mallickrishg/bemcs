name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "bemcs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bemcs and the docs requirements
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pandas addict
          pip install --no-deps -e .
          pip install -r docs/requirements.txt
      - name: Build the HTML (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
